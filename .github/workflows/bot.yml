name: Aggiorna Bot Calcio 360

# Gira da solo 2 volte al giorno, rigenera la pagina e Netlify la pubblica.
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: bot_calcio360/.cache
          key: botcache-${{ hashFiles('bot_calcio360/esempi/*.json') }}
          restore-keys: botcache-
      - name: Lancia il bot
        run: |
          cd bot_calcio360
          python3 batch_main.py --auto --out reports_auto
      - name: Pubblica su Netlify via API (zero conflitti)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          cd bot_calcio360/reports_auto
          zip -qr /tmp/site.zip _report.html
          curl -s -H "Content-Type: application/zip" \
               -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
               --data-binary @/tmp/site.zip \
               "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" | head -c 300
          echo
