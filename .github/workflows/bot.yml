name: "BOT 360 v2 - aggiorna e pubblica su GitHub Pages"

# Gira da solo 2 volte al giorno, rigenera la pagina e GitHub Pages la pubblica.
# Un solo giro alla volta (cancella quello precedente se parte un altro).
concurrency:
  group: bot-360-v2
  cancel-in-progress: true
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: bot_calcio360/.cache
          key: botcache-${{ hashFiles('bot_calcio360/esempi/*.json') }}
          restore-keys: botcache-
      - name: Lancia il bot
        run: |
          cd bot_calcio360
          python3 batch_main.py --auto --out reports_auto
      - name: Prepara la pagina per GitHub Pages
        run: |
          cd bot_calcio360/reports_auto
          mkdir -p ../docs
          cp -r _report.html index.html
          cp -r *.txt ../docs/ 2>/dev/null || true
          echo "Pagina pronta"
      - name: Pubblica su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
          silent: true
          enable_jekyll: false