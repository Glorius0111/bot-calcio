name: "BOT 360 v2"

concurrency:
  group: bot-360-v2
  cancel-in-progress: true
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: bot_calcio360/.cache
          key: botcache-${{ hashFiles('bot_calcio360/esempi/*.json') }}
          restore-keys: botcache-
      - name: Lancia il bot
        run: |
          cd bot_calcio360
          python3 batch_main.py --auto --out reports_auto
      - name: Aggiorna docs/
        run: |
          rm -rf docs
          mkdir docs
          cp bot_calcio360/reports_auto/_report.html docs/index.html
          cp bot_calcio360/reports_auto/*.txt docs/ 2>/dev/null || true
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "Nessun cambiamento" && exit 0
          git commit -m "Aggiorna pagina $(date +%Y-%m-%d\ %H:%M)"
          git push
